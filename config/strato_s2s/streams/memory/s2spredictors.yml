#
# S2S memory-fields-only stream (NO stratosphere) — arm "memory".
# Trimmed memory set: runoff, precipitation/snowfall and cloud channels were dropped
# (noise-floor losses, redundant with ERA5pl tp/cp). Slow fields and radiative fluxes
# are source-only (inputs/boundary conditions, no loss); sst, sd, ci and ttr are
# also targets so that they can be verified.
# Constant/time-encoding fields are routed through geoinfo_channels.

S2Spredictors :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v2-s2s-predictors.zarr']
  stream_id : 1
  source : [
    'sst', 'sd', 'ci', 'ttr',
    'stl1', 'stl2', 'stl3', 'swvl1', 'swvl2', 'swvl3', 'ssrd', 'strd',
    ]
  target : [
    'sst', 'sd', 'ci', 'ttr',
    ]
  geoinfo_channels : ['slt']
  # The loss is a mean over a stream's target channels, so the stream weight is scaled to
  # 4 memory targets / 40 targets of the strat stream. This gives sst/sd/ci/ttr the same
  # per-channel weight (relative to ERA5pl) as in the strat arms.
  loss_weight : 0.1
  # resolves to O96 cos-latitude weighting (grid size detected from the dataset)
  location_weight : auto
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  frequency : 6h
  max_num_targets: 20000
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
  channel_weights :
    sst : 1.0
    sd  : 1.0
    ci  : 1.0
    ttr : 1.0
