# Tropospheric + surface stream from the ERA5 v8 pressure-level dataset (source and target).
# Identical in all strato_s2s arms. The stratosphere is owned by S2Spredictors (strat arms).

ERA5pl :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id : 0
  source : [
    # surface
    '10u', '10v', '2t', '2d', 'msl', 'sp',
    # pressure levels (50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000 hPa)
    # no q at 50/100 hPa (stratospheric humidity is uninformative here)
    'u_50',  'v_50',  't_50',  'z_50',
    'u_100', 'v_100', 't_100', 'z_100',
    'u_150', 'v_150', 'q_150', 't_150', 'z_150',
    'u_200', 'v_200', 'q_200', 't_200', 'z_200',
    'u_250', 'v_250', 'q_250', 't_250', 'z_250',
    'u_300', 'v_300', 'q_300', 't_300', 'z_300',
    'u_400', 'v_400', 'q_400', 't_400', 'z_400',
    'u_500', 'v_500', 'q_500', 't_500', 'z_500',
    'u_600', 'v_600', 'q_600', 't_600', 'z_600',
    'u_700', 'v_700', 'q_700', 't_700', 'z_700',
    'u_850', 'v_850', 'q_850', 't_850', 'z_850',
    'u_925', 'v_925', 'q_925', 't_925', 'z_925',
    'u_1000','v_1000','q_1000','t_1000','z_1000',
    ]
  target : [
    '10u', '10v', '2t', '2d', 'msl', 'sp', 'skt',
    'u_50',  'v_50',  't_50',  'z_50',
    'u_100', 'v_100', 't_100', 'z_100',
    'u_150', 'v_150', 'q_150', 't_150', 'z_150',
    'u_200', 'v_200', 'q_200', 't_200', 'z_200',
    'u_250', 'v_250', 'q_250', 't_250', 'z_250',
    'u_300', 'v_300', 'q_300', 't_300', 'z_300',
    'u_400', 'v_400', 'q_400', 't_400', 'z_400',
    'u_500', 'v_500', 'q_500', 't_500', 'z_500',
    'u_600', 'v_600', 'q_600', 't_600', 'z_600',
    'u_700', 'v_700', 'q_700', 't_700', 'z_700',
    'u_850', 'v_850', 'q_850', 't_850', 'z_850',
    'u_925', 'v_925', 'q_925', 't_925', 'z_925',
    'u_1000','v_1000','q_1000','t_1000','z_1000',
    ]
  geoinfo_channels : ['z', 'lsm', 'slor', 'sdor', 'insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
  loss_weight : 1.
  location_weight : auto
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  frequency : 6h
  max_num_targets: 20000
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
  channel_weights :
    # --- surface ---
    10u : 1.0
    10v : 1.0
    2t  : 1.0
    2d  : 1.0
    msl : 1.0
    sp  : 1.0
    skt : 1.0
